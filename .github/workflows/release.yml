name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
      unpublished: ${{ steps.package.outputs.unpublished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find unpublished version
        id: package
        run: |
          name=$(jq --raw-output .name package.json)
          version=$(jq --raw-output .version package.json)
          status=$(curl --silent --retry 3 --output /dev/null --write-out "%{http_code}" "https://registry.npmjs.org/${name/\//%2f}/$version")
          case $status in
            200) unpublished=false ;;
            404) unpublished=true ;;
            *) echo "npm registry returned $status" && exit 1 ;;
          esac
          {
            echo "name=$name"
            echo "version=$version"
            echo "unpublished=$unpublished"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.unpublished == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          github_token: ""
          cache: false
      - run: pnpm install
      - run: pnpm test
      - run: pnpm pack --out package.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: package.tgz
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ needs.check.outputs.name }}/v/${{ needs.check.outputs.version }}
    permissions:
      id-token: write # npm trusted publishing
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          github_token: ""
          cache: false
          install_args: node
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - name: Publish to npm
        run: |
          if [[ $VERSION == *-* ]]; then
            npm stage publish package.tgz --tag next
          else
            npm stage publish package.tgz
          fi

  release:
    needs: [check, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub release
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Create GitHub release
        run: |
          options=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes)
          if [[ $VERSION == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "v$VERSION" "${options[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
